name: Build Goo Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cache
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libglew-dev \
            libopengl-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libdbus-1-dev \
            linux-libc-dev \
            python3-dev \
            python3-numpy \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libopenexr-dev \
            libssl-dev \
            libfftw3-dev \
            libxml2-dev \
            libtbb-dev \
            libopenvdb-dev \
            libboost-all-dev \
            libfreetype6-dev \
            libpugixml-dev \
            libogg-dev \
            libvorbis-dev \
            libtheora-dev \
            libopenal-dev \
            libsndfile1-dev \
            libsdl2-dev \
            libzstd-dev \
            libblosc-dev \
            ninja-build
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DWITH_CYCLES=ON \
            -DWITH_PYTHON_INSTALL=OFF \
            -DWITH_PLAYER=OFF \
            -DWITH_HEADLESS=OFF \
            -G Ninja
      
      - name: Build
        run: |
          cmake --build build --config Release --parallel $(nproc)
      
      - name: Install
        run: |
          cmake --install build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goo-engine-linux-x64
          path: |
            install/
            build/bin/
          retention-days: 7
          if-no-files-found: warn
      
      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Ubuntu Linux" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Release" >> $GITHUB_STEP_SUMMARY
          echo "- **CMake Version**: $(cmake --version | head -n1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: $(python3 --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Compiler**: $(gcc --version | head -n1)" >> $GITHUB_STEP_SUMMARY
